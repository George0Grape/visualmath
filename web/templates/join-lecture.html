<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Присоединиться к лекции — VisualMath</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7; --surface: #fff; --border: #e4e7ec;
            --text: #1a1d23; --muted: #6b7280; --subtle: #9ca3af;
            --accent: #2563eb; --accent-light: #eff6ff;
            --green: #16a34a; --green-light: #dcfce7;
            --sidebar-w: 260px; --topbar-h: 58px; --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
            --shadow-hover: 0 4px 12px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
        .topbar-logo { font-family: 'Lora', serif; font-weight: 600; font-size: 18px; color: var(--text); text-decoration: none; letter-spacing: -.3px; }
        .topbar-logo span { color: var(--accent); }

        .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; }
        .sb-section { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--subtle); padding: 14px 10px 5px; }
        .sb-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--muted); text-decoration: none; transition: all .15s; }
        .sb-link:hover { background: var(--bg); color: var(--text); }
        .sb-link svg { flex-shrink: 0; opacity: .75; }
        .sb-divider { height: 1px; background: var(--border); margin: 6px 0; }

        .main { margin-left: var(--sidebar-w); padding-top: calc(var(--topbar-h) + 32px); padding-bottom: 60px; padding-left: 36px; padding-right: 36px; }

        .page-title { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

        .live-badge { display: inline-flex; align-items: center; gap: 4px; background: #fee2e2; color: #dc2626; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 2px 8px; letter-spacing: .04em; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #dc2626; animation: pulse 1.2s infinite; flex-shrink: 0; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

        .section-title { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

        .session-card { background: var(--surface); border-radius: var(--radius); border: 1px solid #fecaca; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s; }
        .session-card:hover { box-shadow: var(--shadow-hover); }
        .session-card-head { background: linear-gradient(135deg, #dc2626, #ef4444); padding: 16px 20px; display: flex; align-items: center; gap: 10px; }
        .session-card-title { font-family: 'Lora', serif; font-size: 15px; font-weight: 600; color: white; flex: 1; }
        .session-card-body { padding: 14px 20px; flex: 1; }
        .session-meta { font-size: 13px; color: var(--muted); line-height: 1.9; }
        .session-meta-row { display: flex; align-items: center; gap: 8px; }
        .session-meta-row svg { opacity: .6; flex-shrink: 0; }
        .join-code { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--text); margin: 8px 0; font-family: monospace; }
        .session-card-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .btn-join { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--green); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background .15s; }
        .btn-join:hover { background: #15803d; }
        .btn-join:disabled { background: var(--subtle); cursor: not-allowed; }
        .btn-continue { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s; }
        .btn-continue:hover { background: #1d4ed8; }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 56px 24px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
        .empty-state-icon { width: 48px; height: 48px; margin: 0 auto 16px; opacity: .3; }
        .empty-state-title { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .empty-state p { font-size: 13px; color: var(--muted); }

        .toast { position: fixed; bottom: 24px; right: 24px; z-index: 999; padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-hover); display: none; animation: fadeUp .25s ease; }
        .toast.success { background: var(--green); color: #fff; }
        .toast.error { background: #dc2626; color: #fff; }
        .toast.info { background: var(--accent); color: #fff; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .loading-row { display: flex; align-items: center; gap: 12px; padding: 20px; font-size: 14px; color: var(--muted); }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 700px) { .sidebar { display: none; } .main { margin-left: 0; padding-left: 16px; padding-right: 16px; } }
    </style>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/ui.js"></script>
  <script src="/static/js/breadcrumbs.js"></script>
  <script src="/static/js/search.js"></script>
</head>
<body>

<header class="topbar">
    <a href="/dashboard" class="topbar-logo">Visual<span>Math</span></a>
</header>

<aside class="sidebar">
    <div class="sb-section">Общее</div>
    <a href="/dashboard" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Дашборд
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Учёба</div>
    <a href="/classroom/subjects" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        Classroom
    </a>
    <a href="/student/join" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Присоединиться к лекции
    </a>
</aside>

<main class="main">
    <h1 class="page-title">Присоединиться к лекции</h1>
    <p class="page-sub">Активные лекции обновляются каждые 30 секунд</p>

    <div class="section-title">
        <span class="live-badge"><span class="live-dot"></span>В ЭФИРЕ</span>
        Активные лекции
    </div>
    <div class="grid" id="sessionsGrid">
        <div class="loading-row"><div class="spinner"></div>Загрузка лекций...</div>
    </div>
</main>

<div id="toast" class="toast"></div>

<script>
    let activeSessions = [];
    // Авторизация XHR через Bearer из localStorage + cookie как fallback.
    const token = localStorage.getItem('token') || '';
    function authHeaders() { return token ? { 'Authorization': 'Bearer ' + token } : {}; }

    async function loadActiveSessions() {
        try {
            const response = await fetch('/api/sessions/active', { headers: authHeaders() });
            activeSessions = await response.json();
            renderSessions(activeSessions || []);
        } catch (error) {
            document.getElementById('sessionsGrid').innerHTML = '<div class="empty-state"><svg class="empty-state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="empty-state-title">Ошибка загрузки</div><p>Не удалось получить список лекций</p></div>';
        }
    }

    function formatTime(dateString) {
        const date = new Date(dateString);
        const diffMins = Math.floor((new Date() - date) / 60000);
        if (diffMins < 1) return 'только что';
        if (diffMins < 60) return diffMins + ' мин назад';
        return Math.floor(diffMins / 60) + ' ч назад';
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function renderSessions(sessions) {
        const grid = document.getElementById('sessionsGrid');
        if (!sessions.length) {
            grid.innerHTML = '<div class="empty-state">' +
                '<svg class="empty-state-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>' +
                '<div class="empty-state-title">Нет активных лекций</div>' +
                '<p>Дождитесь, пока преподаватель запустит лекцию</p></div>';
            return;
        }
        grid.innerHTML = sessions.map(function(s) {
            const joined = s.is_joined || false;
            return '<div class="session-card">' +
                '<div class="session-card-head">' +
                    '<div class="live-dot"></div>' +
                    '<div class="session-card-title">' + esc(s.lecture_title || 'Лекция') + '</div>' +
                    '<span class="live-badge"><span class="live-dot"></span>LIVE</span>' +
                '</div>' +
                '<div class="session-card-body">' +
                    '<div class="session-meta">' +
                        '<div class="session-meta-row"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + esc(s.teacher_name || 'Преподаватель') + '</div>' +
                        '<div class="session-meta-row"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>' + (s.student_count || 0) + ' студентов</div>' +
                        '<div class="session-meta-row"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Запущена ' + formatTime(s.created_at) + '</div>' +
                    '</div>' +
                    '<div class="join-code">' + esc(s.join_code) + '</div>' +
                '</div>' +
                '<div class="session-card-foot">' +
                    (joined
                        ? '<a class="btn-continue" href="/student/lecture/slides/' + s.lecture_id + '?session=' + s.session_id + '"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Продолжить</a>'
                        : '<button class="btn-join" onclick="joinSession(\'' + s.session_id + '\', this)"><svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Присоединиться</button>'
                    ) +
                '</div>' +
                '</div>';
        }).join('');
    }

    async function joinSession(sessionId, btn) {
        if (btn) { btn.disabled = true; btn.textContent = 'Подключение...'; }
        showToast('Присоединение к лекции...', 'info');
        try {
            const response = await fetch('/api/sessions/join?session_id=' + sessionId, { method: 'POST', headers: authHeaders() });
            const result = await response.json();
            if (result.success) {
                showToast('Успешно! Перенаправление...', 'success');
                setTimeout(() => { window.location.href = result.redirect_url; }, 1200);
            } else {
                showToast('Ошибка: ' + result.message, 'error');
                if (btn) { btn.disabled = false; btn.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Присоединиться'; }
            }
        } catch (error) {
            showToast('Ошибка сети', 'error');
            if (btn) { btn.disabled = false; btn.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>Присоединиться'; }
        }
    }

    function showToast(text, type) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.className = 'toast ' + type;
        t.style.display = 'block';
        if (type !== 'info') { setTimeout(() => { t.style.display = 'none'; }, 4000); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadActiveSessions();
        setInterval(loadActiveSessions, 30000);
    });
</script>
</body>
</html>
