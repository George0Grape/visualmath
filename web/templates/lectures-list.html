<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лекции — VisualMath</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root { --bg: #f4f5f7; --surface: #fff; --border: #e4e7ec; --text: #1a1d23; --muted: #6b7280; --subtle: #9ca3af; --accent: #2563eb; --accent-light: #eff6ff; --sidebar-w: 260px; --topbar-h: 58px; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); --shadow-hover: 0 4px 12px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.06); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
        .topbar-logo { font-family: 'Lora', serif; font-weight: 600; font-size: 18px; color: var(--text); text-decoration: none; letter-spacing: -.3px; }
        .topbar-logo span { color: var(--accent); }
        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; }
        .btn-create { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s; }
        .btn-create:hover { background: #1d4ed8; }
        .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; }
        .sb-section { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--subtle); padding: 14px 10px 5px; }
        .sb-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--muted); text-decoration: none; transition: all .15s; }
        .sb-link:hover { background: var(--bg); color: var(--text); }
        .sb-link.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
        .sb-link svg { flex-shrink: 0; opacity: .75; }
        .sb-divider { height: 1px; background: var(--border); margin: 6px 0; }
        .main { margin-left: var(--sidebar-w); padding-top: calc(var(--topbar-h) + 28px); padding-bottom: 60px; padding-left: 32px; padding-right: 32px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .page-title { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: var(--text); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
        .lecture-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .2s, transform .15s; }
        .lecture-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .lecture-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
        .lecture-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .lecture-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
        .lecture-body { padding: 12px 20px; flex: 1; font-size: 13px; color: var(--muted); line-height: 1.5; }
        .lecture-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .btn-open { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; background: var(--accent); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s; }
        .btn-open:hover { background: #1d4ed8; }
        .btn-edit { display: inline-flex; align-items: center; gap: 5px; padding: 7px 14px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; transition: all .15s; }
        .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
        .empty-state { grid-column: 1/-1; text-align: center; padding: 64px 24px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
        .empty-state svg { color: var(--subtle); margin-bottom: 16px; }
        .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .empty-state p { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
        @keyframes shimmer { 0%,100%{opacity:1}50%{opacity:.45} }
        .sk { background: var(--border); border-radius: 6px; animation: shimmer 1.4s ease-in-out infinite; }
        @media (max-width: 700px) { .sidebar { display: none; } .main { margin-left: 0; padding-left: 16px; padding-right: 16px; } }
    </style>
    <script>
        // Авторизация XHR через Bearer из localStorage + cookie как fallback.
        const token = localStorage.getItem('token') || '';
        function authHeaders() { return token ? { 'Authorization': 'Bearer ' + token } : {}; }
        function skCard() {
            return '<div class="lecture-card" style="pointer-events:none">' +
                '<div class="lecture-head"><div class="sk" style="height:18px;width:70%;margin-bottom:10px"></div><div class="sk" style="height:12px;width:50%"></div></div>' +
                '<div class="lecture-body"><div class="sk" style="height:12px;width:100%;margin-bottom:8px"></div><div class="sk" style="height:12px;width:75%"></div></div>' +
                '<div class="lecture-foot"><div class="sk" style="height:32px;width:80px;border-radius:8px;margin-right:8px"></div><div class="sk" style="height:32px;width:110px;border-radius:8px"></div></div>' +
                '</div>';
        }
        function emptyState(iconPath, title, desc, href) {
            const btn = href ? '<a href="' + href + '" class="btn-open">Создать лекцию</a>' : '';
            return '<div class="empty-state">' +
                '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' + iconPath + '</svg>' +
                '<h3>' + title + '</h3><p>' + desc + '</p>' + btn + '</div>';
        }
        async function loadLectures() {
            document.getElementById('lecturesGrid').innerHTML = Array(4).fill(skCard()).join('');
            try {
                const res = await fetch('/api/lectures', { headers: authHeaders() });
                const lectures = await res.json();
                displayLectures(lectures);
            } catch(e) {
                document.getElementById('lecturesGrid').innerHTML = emptyState(
                    '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
                    'Не удалось загрузить лекции', 'Проверьте соединение и обновите страницу', null
                );
            }
        }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function displayLectures(lectures) {
            const grid = document.getElementById('lecturesGrid');
            if (!lectures || !lectures.length) {
                grid.innerHTML = emptyState(
                    '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
                    'Лекций пока нет', 'Создайте первую лекцию и добавьте в неё модули', '/lectures/create'
                );
                return;
            }
            grid.innerHTML = lectures.map(l =>
                '<div class="lecture-card">' +
                '<div class="lecture-head"><div class="lecture-title">' + esc(l.title) + '</div>' +
                '<div class="lecture-meta"><span>' + esc(l.course||'') + '</span><span>' + l.modules_count + ' модулей</span><span>' + esc(l.author_name||'') + '</span></div></div>' +
                '<div class="lecture-body">' + esc(l.description||'Описание отсутствует') + '</div>' +
                '<div class="lecture-foot"><a href="/lectures/view/' + l.id + '" class="btn-open">Открыть</a><a href="/lectures/edit/' + l.id + '" class="btn-edit">Редактировать</a></div>' +
                '</div>'
            ).join('');
        }
        window.addEventListener('DOMContentLoaded', loadLectures);
    </script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/ui.js"></script>
  <script src="/static/js/breadcrumbs.js"></script>
  <script src="/static/js/search.js"></script>
</head>
<body>
<header class="topbar">
    <a href="/dashboard" class="topbar-logo">Visual<span>Math</span></a>
    <div class="topbar-right">
        <a href="/lectures/create" class="btn-create">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Создать лекцию
        </a>
    </div>
</header>
<aside class="sidebar">
    <div class="sb-section">Общее</div>
    <a href="/dashboard" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Дашборд
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Контент</div>
    <a href="/modules" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Библиотека модулей
    </a>
    <a href="/lectures" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Мои лекции
    </a>
    <a href="/lectures/launch" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Начать лекцию
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Classroom</div>
    <a href="/classroom/subjects" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        Мои предметы
    </a>
    <a href="/classroom/subjects/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Создать предмет
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Создание</div>
    <a href="/modules/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Создать модуль
    </a>
    <a href="/lectures/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Создать лекцию
    </a>
</aside>
<main class="main">
    <div class="page-header">
        <h1 class="page-title">Лекции</h1>
    </div>
    <div class="grid" id="lecturesGrid"></div>
</main>
</body>
</html>
