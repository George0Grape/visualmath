<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск лекции — VisualMath</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7; --surface: #fff; --border: #e4e7ec;
            --text: #1a1d23; --muted: #6b7280; --subtle: #9ca3af;
            --accent: #2563eb; --accent-light: #eff6ff;
            --green: #16a34a; --green-light: #dcfce7;
            --sidebar-w: 260px; --topbar-h: 58px; --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
            --shadow-hover: 0 4px 12px rgba(0,0,0,.10), 0 16px 40px rgba(0,0,0,.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
        .topbar-logo { font-family: 'Lora', serif; font-weight: 600; font-size: 18px; color: var(--text); text-decoration: none; letter-spacing: -.3px; }
        .topbar-logo span { color: var(--accent); }

        .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; }
        .sb-section { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--subtle); padding: 14px 10px 5px; }
        .sb-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; color: var(--muted); text-decoration: none; transition: all .15s; }
        .sb-link:hover { background: var(--bg); color: var(--text); }
        .sb-link.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
        .sb-link svg { flex-shrink: 0; opacity: .75; }
        .sb-divider { height: 1px; background: var(--border); margin: 6px 0; }

        .main { margin-left: var(--sidebar-w); padding-top: calc(var(--topbar-h) + 32px); padding-bottom: 60px; padding-left: 36px; padding-right: 36px; }

        .page-title { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }
        .section-title { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 14px; margin-top: 28px; display: flex; align-items: center; gap: 8px; }

        /* Active sessions */
        .live-badge { display: inline-flex; align-items: center; gap: 4px; background: #fee2e2; color: #dc2626; border-radius: 99px; font-size: 11px; font-weight: 700; padding: 2px 8px; letter-spacing: .04em; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #dc2626; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

        /* Live card */
        .live-card {
            background: var(--surface); border-radius: var(--radius); border: 1px solid #fecaca;
            box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
            transition: box-shadow .2s;
        }
        .live-card:hover { box-shadow: var(--shadow-hover); }
        .live-card-head { background: linear-gradient(135deg, #dc2626, #ef4444); padding: 16px 20px; display: flex; align-items: center; gap: 10px; }
        .live-card-title { font-family: 'Lora', serif; font-size: 15px; font-weight: 600; color: white; flex: 1; }
        .live-card-body { padding: 14px 20px; flex: 1; }
        .live-meta { font-size: 13px; color: var(--muted); line-height: 1.8; }
        .live-code { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--text); margin: 8px 0; font-family: monospace; }
        .live-card-foot { padding: 12px 20px; border-top: 1px solid var(--border); }
        .btn-resume { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #dc2626; color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s; }
        .btn-resume:hover { background: #b91c1c; }

        /* Lecture card */
        .lecture-card {
            background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
            transition: box-shadow .2s, transform .15s;
        }
        .lecture-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
        .lecture-card-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
        .lecture-card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .lecture-card-meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
        .lecture-card-body { padding: 12px 20px; flex: 1; font-size: 13px; color: var(--muted); line-height: 1.5; }
        .lecture-card-foot { padding: 12px 20px; border-top: 1px solid var(--border); }
        .btn-launch { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; background: var(--green); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background .15s; }
        .btn-launch:hover { background: #15803d; }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 48px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); font-size: 14px; color: var(--muted); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeUp .3s ease both; }

        @media (max-width: 700px) { .sidebar { display: none; } .main { margin-left: 0; padding-left: 16px; padding-right: 16px; } }
    </style>
    <script>
        // Авторизация XHR через Bearer из localStorage + cookie как fallback.
        const token = localStorage.getItem('token') || '';
        function authHeaders() { return token ? { 'Authorization': 'Bearer ' + token } : {}; }
        async function loadPage() {
            try {
                const [sessionsResp, lecturesResp] = await Promise.all([
                    fetch('/api/sessions/active', { headers: authHeaders() }),
                    fetch('/api/lectures', { headers: authHeaders() })
                ]);
                const sessions = await sessionsResp.json();
                const lectures = await lecturesResp.json();
                displayActiveSessions(sessions || []);
                displayLectures(lectures || []);
            } catch(e) {
                document.getElementById('lecturesGrid').innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
            }
        }

        function formatTime(dateString) {
            const date = new Date(dateString);
            const diffMins = Math.floor((new Date() - date) / 60000);
            if (diffMins < 1) return 'только что';
            if (diffMins < 60) return diffMins + ' мин назад';
            return Math.floor(diffMins / 60) + ' ч назад';
        }

        function displayActiveSessions(sessions) {
            const block = document.getElementById('activeBlock');
            const grid = document.getElementById('activeGrid');
            if (!sessions.length) { block.style.display = 'none'; return; }
            block.style.display = 'block';
            grid.innerHTML = sessions.map(function(s) {
                return '<div class="live-card">' +
                    '<div class="live-card-head">' +
                        '<div class="live-dot"></div>' +
                        '<div class="live-card-title">' + esc(s.lecture_title || 'Лекция') + '</div>' +
                        '<span class="live-badge"><span class="live-dot"></span>LIVE</span>' +
                    '</div>' +
                    '<div class="live-card-body">' +
                        '<div class="live-meta">' +
                            '<div>' + (s.student_count || 0) + ' студентов онлайн</div>' +
                            '<div>Запущена ' + formatTime(s.created_at) + '</div>' +
                        '</div>' +
                        '<div class="live-code">' + esc(s.join_code) + '</div>' +
                    '</div>' +
                    '<div class="live-card-foot"><a class="btn-resume" href="/teacher/lecture/slides/' + s.lecture_id + '?session=' + s.session_id + '">' +
                        '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
                        'Вернуться в лекцию</a></div>' +
                    '</div>';
            }).join('');
        }

        function displayLectures(lectures) {
            const grid = document.getElementById('lecturesGrid');
            if (!lectures.length) {
                grid.innerHTML = '<div class="empty-state">Нет доступных лекций. <a href="/lectures/create" style="color:var(--accent)">Создайте первую</a></div>';
                return;
            }
            grid.innerHTML = lectures.map(function(l) {
                return '<div class="lecture-card">' +
                    '<div class="lecture-card-head">' +
                        '<div class="lecture-card-title">' + esc(l.title) + '</div>' +
                        '<div class="lecture-card-meta"><span>' + esc(l.course||'') + '</span><span>' + l.modules_count + ' модулей</span></div>' +
                    '</div>' +
                    '<div class="lecture-card-body">' + esc(l.description||'') + '</div>' +
                    '<div class="lecture-card-foot">' +
                        '<button class="btn-launch" onclick="launchLecture(' + l.id + ')">' +
                            '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>' +
                            'Запустить' +
                        '</button>' +
                    '</div>' +
                    '</div>';
            }).join('');
        }

        function launchLecture(id) { window.location.href = '/lectures/start/' + id; }
        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        window.addEventListener('DOMContentLoaded', loadPage);
    </script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/ui.js"></script>
  <script src="/static/js/breadcrumbs.js"></script>
  <script src="/static/js/search.js"></script>
</head>
<body>

<header class="topbar">
    <a href="/dashboard" class="topbar-logo">Visual<span>Math</span></a>
</header>

<aside class="sidebar">
    <div class="sb-section">Общее</div>
    <a href="/dashboard" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Дашборд
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Контент</div>
    <a href="/modules" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Библиотека модулей
    </a>
    <a href="/lectures" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Мои лекции
    </a>
    <a href="/lectures/launch" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Начать лекцию
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Classroom</div>
    <a href="/classroom/subjects" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        Мои предметы
    </a>
    <a href="/classroom/subjects/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Создать предмет
    </a>
    <div class="sb-divider"></div>
    <div class="sb-section">Создание</div>
    <a href="/modules/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        Создать модуль
    </a>
    <a href="/lectures/create" class="sb-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Создать лекцию
    </a>
</aside>

<main class="main">
    <h1 class="page-title animate">Запуск лекции</h1>
    <p class="page-sub animate">Выберите лекцию для начала онлайн-сессии</p>

    <div id="activeBlock" style="display:none;">
        <div class="section-title">
            <span class="live-badge"><span class="live-dot"></span>В ЭФИРЕ</span>
            Активные сессии
        </div>
        <div class="grid" id="activeGrid"></div>
    </div>

    <div class="section-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        Запустить новую лекцию
    </div>
    <div class="grid" id="lecturesGrid">
        <div class="empty-state">Загрузка лекций...</div>
    </div>
</main>

</body>
</html>
