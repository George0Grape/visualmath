<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — VisualMath</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root { --border: #e4e7ec; --text: #1a1d23; --muted: #6b7280; --accent: #2563eb; --accent-light: #eff6ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #f4f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

        .card { background: #fff; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 24px rgba(0,0,0,.06); width: 100%; max-width: 440px; overflow: hidden; animation: fadeUp .4s ease both; }

        .card-top { background: linear-gradient(135deg, #064e3b, #065f46); padding: 28px 32px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
        .card-top::after { content: ''; position: absolute; right: -20px; top: -20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.07); }
        .logo-mark { width: 40px; height: 40px; background: rgba(255,255,255,.15); border: 1.5px solid rgba(255,255,255,.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Lora', serif; font-size: 18px; font-weight: 700; color: white; flex-shrink: 0; }
        .logo-text { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: white; }
        .logo-sub { font-size: 12px; color: rgba(255,255,255,.65); }

        .card-body { padding: 28px 32px 32px; }
        .form-title { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 20px; }

        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
        .field input, .field select {
            width: 100%; padding: 10px 14px;
            border: 1.5px solid var(--border); border-radius: 8px;
            font-size: 15px; font-family: 'DM Sans', sans-serif;
            outline: none; transition: border .2s, box-shadow .2s;
            background: #fff; color: var(--text);
        }
        .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
        .field-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

        .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
        .msg.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .btn-primary { width: 100%; padding: 12px; border: none; border-radius: 9px; background: var(--accent); color: #fff; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 6px; }
        .btn-primary:hover { background: #1d4ed8; }

        .links { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 20px; }
        .links a { font-size: 13px; color: var(--accent); text-decoration: none; }
        .links a:hover { text-decoration: underline; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/ui.js"></script>
  <script src="/static/js/breadcrumbs.js"></script>
  <script src="/static/js/search.js"></script>
</head>
<body>
    <div class="card">
        <div class="card-top">
            <div class="logo-mark">V</div>
            <div>
                <div class="logo-text">VisualMath</div>
                <div class="logo-sub">Регистрация аккаунта</div>
            </div>
        </div>
        <div class="card-body">
            <div id="message" class="msg"></div>

            <!-- Шаг 1: данные -->
            <div id="step1">
                <div class="form-title">Создать аккаунт</div>
                <form id="registerForm">
                    <div class="field">
                        <label for="login">Логин *</label>
                        <input type="text" id="login" name="login" placeholder="Придумайте логин" required>
                    </div>
                    <div class="field">
                        <label for="email">Email *</label>
                        <input type="text" id="email" name="email" placeholder="Ваш email" required>
                    </div>
                    <div class="field">
                        <label for="password">Пароль *</label>
                        <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
                        <div class="field-hint">Минимум 8 символов</div>
                    </div>
                    <button type="submit" class="btn-primary">Продолжить</button>
                </form>
            </div>

            <!-- Шаг 2: код -->
            <div id="step2" style="display:none;">
                <div class="form-title">Подтвердите email</div>
                <p style="font-size:14px;color:#6b7280;margin-bottom:20px;" id="verifyHint"></p>
                <form id="verifyForm">
                    <div class="field">
                        <label for="code">Код из письма *</label>
                        <input type="text" id="code" name="code" placeholder="000000" maxlength="6"
                            style="font-size:28px;letter-spacing:10px;text-align:center;" required autocomplete="one-time-code">
                    </div>
                    <button type="submit" class="btn-primary">Подтвердить</button>
                </form>
                <div style="margin-top:12px;text-align:center;">
                    <a href="#" id="resendLink" style="font-size:13px;color:#6b7280;">Отправить код повторно</a>
                </div>
            </div>

            <div class="links">
                <a href="/login">Уже есть аккаунт?</a>
                <a href="/">На главную</a>
            </div>
        </div>
    </div>

    <script>
        let pendingEmail = '';

        function showMsg(text, type) {
            const msg = document.getElementById('message');
            msg.className = 'msg ' + type;
            msg.textContent = text;
            msg.style.display = 'block';
        }

        async function sendCode(data) {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });
            return res;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('message').style.display = 'none';

            const data = {
                login: document.getElementById('login').value.trim(),
                password: document.getElementById('password').value,
                email: document.getElementById('email').value.trim(),
                user_type: 'student',
            };
            if (data.password.length < 8) { showMsg('Пароль должен быть минимум 8 символов', 'error'); return; }

            try {
                const res = await sendCode(data);
                const json = await res.json();
                if (res.ok && json.need_verify) {
                    pendingEmail = data.email;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.getElementById('verifyHint').textContent = 'Мы отправили 6-значный код на ' + data.email;
                    document.getElementById('code').focus();
                } else {
                    showMsg(json.message || 'Ошибка регистрации', 'error');
                }
            } catch(err) {
                showMsg('Ошибка сети: ' + err.message, 'error');
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('message').style.display = 'none';
            try {
                const res = await fetch('/api/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail, code: document.getElementById('code').value.trim() }),
                });
                const json = await res.json();
                if (res.ok && json.success) {
                    showMsg('Аккаунт создан! Перенаправление на вход...', 'success');
                    setTimeout(() => { window.location.href = '/login'; }, 1800);
                } else {
                    showMsg(json.message || 'Неверный код', 'error');
                }
            } catch(err) {
                showMsg('Ошибка сети: ' + err.message, 'error');
            }
        });

        document.getElementById('resendLink').addEventListener('click', async function(e) {
            e.preventDefault();
            if (!pendingEmail) return;
            // повторно отправляем с теми же данными что ввёл пользователь
            const data = {
                login: document.getElementById('login').value.trim(),
                password: document.getElementById('password').value,
                email: pendingEmail,
                user_type: 'student',
            };
            try {
                await sendCode(data);
                showMsg('Код отправлен повторно', 'success');
            } catch(err) {
                showMsg('Ошибка: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
