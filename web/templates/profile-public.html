<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль — VisualMath</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--border:#e4e7ec;--text:#1a1d23;--muted:#6b7280;--accent:#2563eb;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Lora',serif;font-weight:600;font-size:18px;color:var(--text);text-decoration:none;}
.topbar-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;}
.topbar-back:hover{color:var(--text);}

.main{max-width:820px;margin:0 auto;padding:36px 24px;}

.profile-card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:32px;display:flex;gap:28px;align-items:flex-start;margin-bottom:28px;}
.avatar-wrap{flex-shrink:0;}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--border);}
.avatar-placeholder{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-family:'Lora',serif;font-size:22px;font-weight:600;margin-bottom:4px;}
.profile-role{font-size:13px;color:var(--muted);margin-bottom:14px;}
.profile-meta{display:flex;flex-direction:column;gap:8px;}
.profile-meta-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
.profile-meta-row svg{flex-shrink:0;}
.profile-meta-row span{color:var(--text);}
.profile-meta-row a{color:var(--accent);text-decoration:none;}
.profile-meta-row a:hover{text-decoration:underline;}
.profile-about{margin-top:14px;font-size:14px;line-height:1.65;color:var(--text);white-space:pre-wrap;}

.section-title{font-family:'Lora',serif;font-size:18px;font-weight:600;margin-bottom:16px;}
.lectures-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.lecture-card{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:18px;color:inherit;display:block;transition:box-shadow .15s,transform .1s;cursor:pointer;}
.lecture-card:hover{box-shadow:0 4px 20px rgba(37,99,235,.12);transform:translateY(-1px);}
.lc-course{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px;}
.lc-title{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.35;}
.lc-meta{font-size:12px;color:var(--muted);}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:#fef9c3;color:#92400e;margin-left:6px;}

.loading{text-align:center;padding:60px;color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px;}

/* Шаблон без mobile-nav.js — мобильные правила локальные. */
@media (max-width:700px){
  html,body{overflow-x:hidden;}
  .topbar{padding:0 16px;gap:12px;}
  .main{padding:24px 16px;}
  .profile-card{flex-direction:column;padding:24px;gap:18px;}
  .avatar-wrap{align-self:center;}        /* аватар по центру, инфо текстом слева */
  .profile-name{font-size:20px;}
  .profile-meta-row{overflow-wrap:anywhere;}
  .lectures-grid{grid-template-columns:1fr;}
}
</style>
<script src="/static/js/theme.js"></script>
</head>
<body>
<div class="topbar">
  <a href="/dashboard" class="topbar-logo">VisualMath</a>
  <a href="javascript:history.back()" class="topbar-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Назад
  </a>
</div>

<div class="main">
  <div id="loading" class="loading">Загрузка...</div>

  <div id="content" style="display:none">
    <div class="profile-card" id="profileCard"></div>

    <div id="lecturesSection" style="display:none">
      <div class="section-title">Опубликованные лекции</div>
      <div class="lectures-grid" id="lecturesGrid"></div>
    </div>
  </div>
</div>

<script>
const profileId = '{{.ProfileID}}';

async function load() {
    try {
        const [profileResp, lecturesResp] = await Promise.all([
            fetch('/api/profile/' + profileId),
            fetch('/api/lectures/published?author_id=' + profileId)
        ]);

        if (!profileResp.ok) {
            document.getElementById('loading').textContent = 'Пользователь не найден';
            return;
        }

        const profile = await profileResp.json();
        const lecturesData = lecturesResp.ok ? await lecturesResp.json() : {lectures: []};
        const lectures = lecturesData.lectures || [];

        renderProfile(profile);
        if (profile.user_type === 'teacher' && lectures.length > 0) {
            renderLectures(lectures);
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    } catch(e) {
        document.getElementById('loading').textContent = 'Ошибка загрузки';
    }
}

function renderProfile(p) {
    const roleLabel = p.user_type === 'teacher' ? 'Преподаватель' : 'Студент';
    const initials = (p.full_name||'?').split(' ').map(w=>w.charAt(0)).join('').slice(0,2).toUpperCase();
    const avatarHtml = p.avatar_url
        ? `<img class="avatar" src="${esc(p.avatar_url)}" alt="">`
        : `<div class="avatar-placeholder">${initials}</div>`;

    let metaHtml = '';
    if (p.email) {
        metaHtml += `<div class="profile-meta-row">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>
        </div>`;
    }
    if (p.university) {
        metaHtml += `<div class="profile-meta-row">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
            <span>${esc(p.university)}</span>
        </div>`;
    }
    if (p.group_number) {
        metaHtml += `<div class="profile-meta-row">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <span>Группа: ${esc(p.group_number)}</span>
        </div>`;
    }

    document.getElementById('profileCard').innerHTML = `
        <div class="avatar-wrap">${avatarHtml}</div>
        <div class="profile-info">
            <div class="profile-name">${esc(p.full_name)}</div>
            <div class="profile-role">${roleLabel}</div>
            ${metaHtml ? `<div class="profile-meta">${metaHtml}</div>` : ''}
            ${p.about ? `<div class="profile-about">${esc(p.about)}</div>` : ''}
        </div>`;
}

function renderLectures(lectures) {
    document.getElementById('lecturesSection').style.display = 'block';
    document.getElementById('lecturesGrid').innerHTML = lectures.map(l => {
        const noTest = l.hide_tests ? '<span class="tag">без тестов</span>' : '';
        const cnt = l.modules_count || 0;
        return `<div class="lecture-card" onclick="location.href='/lectures/published/${l.id}'">
            <div class="lc-course">${esc(l.course)}</div>
            <div class="lc-title">${esc(l.title)}${noTest}</div>
            <div class="lc-meta">${cnt} ${cnt===1?'модуль':cnt<5?'модуля':'модулей'}</div>
        </div>`;
    }).join('');
}

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
