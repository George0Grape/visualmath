<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualMath — Платформа для изучения математики</title>
    <meta name="description" content="Интерактивная платформа для математических лекций с тестами, опросами и синхронизацией в реальном времени">
    <meta property="og:title" content="VisualMath — Платформа для изучения математики">
    <meta property="og:description" content="Интерактивная платформа для математических лекций с тестами, опросами и синхронизацией в реальном времени">
    <meta property="og:url" content="https://visualmath.ru">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="VisualMath">
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e4e7ec;
            --text: #1a1d23;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

        .card {
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }

        .card-top {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            padding: 36px 36px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-top::after { content: ''; position: absolute; right: -30px; top: -30px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.07); }
        .card-top::before { content: ''; position: absolute; left: -20px; bottom: -40px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.05); }

        .logo-mark {
            width: 52px; height: 52px;
            background: rgba(255,255,255,.15);
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
            font-family: 'Lora', serif;
            font-size: 22px; font-weight: 700;
            color: white;
        }
        .logo-name { font-family: 'Lora', serif; font-size: 24px; font-weight: 600; color: white; margin-bottom: 6px; }
        .logo-sub { font-size: 13px; color: rgba(255,255,255,.7); }

        .card-body { padding: 28px 32px 32px; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px 20px;
            border-radius: 9px; border: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: all .15s;
        }
        .btn-primary { background: var(--accent); color: #fff; margin-bottom: 10px; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

        .oauth-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-oauth {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px; border-radius: 9px; border: 1.5px solid var(--border);
            background: var(--surface); color: var(--text);
            font-size: 14px; font-weight: 600; text-decoration: none;
            transition: border-color .15s, box-shadow .15s, background .15s; font-family: 'DM Sans', sans-serif;
        }
        .btn-oauth:hover { border-color: #aab4be; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
        .btn-oauth img { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; }
        .btn-oauth.btn-vk:hover { border-color: #0077FF; background: #f0f7ff; }
        .btn-oauth.btn-ya:hover { border-color: #FC3F1D; background: #fff5f3; }

        .footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .card { animation: fadeUp .4s ease both; }
    </style>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/toast.js"></script>
    <script src="/static/js/mobile-nav.js"></script>
    <script src="/static/js/ui.js"></script>
  <script src="/static/js/breadcrumbs.js"></script>
  <script src="/static/js/search.js"></script>
</head>
<body>
    <div class="card">
        <div class="card-top">
            <div class="logo-mark"><svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M7 25 H25 M7 25 V7" stroke="rgba(255,255,255,.5)" stroke-width="1.6" stroke-linecap="round"/><path d="M8 9 Q16 30 24 9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></div>
            <div class="logo-name">VisualMath</div>
            <div class="logo-sub">Платформа для интерактивного изучения математики</div>
        </div>
        <div class="card-body">
            <div class="oauth-row">
                <a href="/auth/vk" class="btn-oauth btn-vk">
                    <img src="/static/img/vk-icon.svg" alt="VK">
                    ВКонтакте
                </a>
                <a href="/auth/yandex" class="btn-oauth btn-ya">
                    <img src="/static/img/ya-icon.svg" alt="Яндекс">
                    Яндекс
                </a>
            </div>

            <div class="divider"><span>или через аккаунт</span></div>

            <a href="/login" class="btn btn-primary">Войти в аккаунт</a>
            <a href="/register" class="btn btn-outline">Создать аккаунт</a>
        </div>
    </div>
    <div class="footer" style="margin-top: 20px;">VisualMath Platform © 2026</div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('oauth_success') === 'true') {
                if (window.showToast) showToast('Авторизация успешна! Войдите снова.', 'success');
            }
            if (localStorage.getItem('token')) {
                setTimeout(function() { window.location.href = '/dashboard'; }, 500);
            }
        });
    </script>
</body>
</html>
