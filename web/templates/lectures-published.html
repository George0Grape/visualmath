<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Опубликованные лекции — VisualMath</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--border:#e4e7ec;--text:#1a1d23;--muted:#6b7280;--accent:#2563eb;--accent-hover:#1d4ed8;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:20px;position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Lora',serif;font-weight:600;font-size:18px;color:var(--text);text-decoration:none;}
.topbar-back{font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:4px;}
.topbar-back:hover{color:var(--text);}

.main{max-width:1100px;margin:0 auto;padding:32px 24px;}
.page-heading{font-family:'Lora',serif;font-size:26px;font-weight:600;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:28px;}

.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:flex-end;}
.filter-group{display:flex;flex-direction:column;gap:5px;}
.filter-group label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.filter-group select,.filter-group input{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;min-width:170px;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--accent);}
.btn-clear{padding:8px 16px;border:1.5px solid var(--border);background:var(--surface);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--muted);align-self:flex-end;}
.btn-clear:hover{border-color:var(--accent);color:var(--accent);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;}

.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:22px;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,transform .1s;}
.card:hover{box-shadow:0 4px 20px rgba(37,99,235,.12);transform:translateY(-1px);}
.card-course{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);}
.card-title{font-family:'Lora',serif;font-size:17px;font-weight:600;line-height:1.35;}
.card-desc{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
.card-author{font-size:13px;color:var(--muted);}
.card-author a{color:var(--accent);text-decoration:none;font-weight:500;}
.card-author a:hover{text-decoration:underline;}
.card-tags{display:flex;gap:6px;}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:4px;background:var(--bg);color:var(--muted);}
.tag-notest{background:#fef9c3;color:#92400e;}
.tag-comments{background:#dbeafe;color:#1d4ed8;display:inline-flex;align-items:center;gap:3px;}

.empty{text-align:center;padding:80px 20px;color:var(--muted);}
.empty svg{margin-bottom:16px;opacity:.3;}
.empty p{font-size:15px;}

.loading{text-align:center;padding:80px;color:var(--muted);font-size:15px;}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.45}}
.sk{background:var(--border);border-radius:6px;animation:shimmer 1.4s ease-in-out infinite;}
@media (max-width:700px){
  .topbar{padding:0 16px;gap:12px;}
  .main{padding:20px 16px;}
  .page-heading{font-size:22px;}
  .filters{gap:10px;}
  .filter-group{flex:1;min-width:140px;}
  .filter-group select,.filter-group input{min-width:0;width:100%;}
  .btn-clear{align-self:stretch;}
  .grid{grid-template-columns:1fr;}
}
</style>
<script src="/static/js/theme.js"></script>
</head>
<body>
<div class="topbar">
  <a href="/dashboard" class="topbar-logo">VisualMath</a>
  <a href="/dashboard" class="topbar-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Дашборд
  </a>
</div>

<div class="main">
  <div class="page-heading">Опубликованные лекции</div>
  <div class="page-sub">Материалы преподавателей, доступные для самостоятельного изучения</div>

  <div class="filters">
    <div class="filter-group">
      <label>Предмет</label>
      <select id="filterCourse" onchange="applyFilters()">
        <option value="">Все предметы</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Преподаватель</label>
      <input type="text" id="filterAuthor" placeholder="ФИО..." oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Год</label>
      <select id="filterYear" onchange="applyFilters()">
        <option value="">Все годы</option>
      </select>
    </div>
    <button class="btn-clear" onclick="clearFilters()">Сбросить</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">
    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <p>Лекций не найдено</p>
  </div>
</div>

<script>
let allLectures = [];
let filterTimer = null;

function skCard() {
    return '<div class="card" style="pointer-events:none;cursor:default">' +
        '<div class="sk" style="height:11px;width:35%"></div>' +
        '<div class="sk" style="height:18px;width:80%"></div>' +
        '<div class="sk" style="height:12px;width:100%"></div>' +
        '<div class="sk" style="height:12px;width:65%"></div>' +
        '<div class="card-meta" style="margin-top:8px">' +
            '<div class="sk" style="height:12px;width:90px"></div>' +
            '<div class="sk" style="height:18px;width:70px;border-radius:4px"></div>' +
        '</div></div>';
}

async function load() {
    const grid = document.getElementById('grid');
    grid.innerHTML = Array(6).fill(skCard()).join('');
    try {
        const resp = await fetch('/api/lectures/published');
        const data = await resp.json();
        allLectures = data.lectures || [];

        const courseSelect = document.getElementById('filterCourse');
        (data.courses || []).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.textContent = c;
            courseSelect.appendChild(opt);
        });

        const yearSelect = document.getElementById('filterYear');
        (data.years || []).forEach(y => {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            yearSelect.appendChild(opt);
        });

        renderGrid(allLectures);
    } catch(e) {
        grid.innerHTML = '';
        const empty = document.getElementById('empty');
        empty.querySelector('p').textContent = 'Ошибка загрузки. Проверьте соединение.';
        empty.style.display = 'block';
    }
}

function applyFilters() {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
        const course = document.getElementById('filterCourse').value.toLowerCase();
        const author = document.getElementById('filterAuthor').value.toLowerCase();
        const year = document.getElementById('filterYear').value;
        const filtered = allLectures.filter(l =>
            (!course || l.course.toLowerCase() === course) &&
            (!author || l.author.toLowerCase().includes(author)) &&
            (!year || l.created_at.startsWith(year))
        );
        renderGrid(filtered);
    }, 200);
}

function clearFilters() {
    document.getElementById('filterCourse').value = '';
    document.getElementById('filterAuthor').value = '';
    document.getElementById('filterYear').value = '';
    renderGrid(allLectures);
}

function renderGrid(lectures) {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    if (!lectures || lectures.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = lectures.map(l => {
        const noTest = l.hide_tests ? '<span class="tag tag-notest">без тестов</span>' : '';
        const cnt = l.modules_count || 0;
        const modLabel = cnt + ' ' + (cnt===1?'модуль':cnt<5?'модуля':'модулей');
        const cc = l.comment_count || 0;
        const commentsTag = cc > 0
            ? `<span class="tag tag-comments"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>${cc}</span>`
            : '';
        const year = (l.created_at||'').slice(0,4);
        return `<div class="card" onclick="location.href='/lectures/published/${l.id}'">
            <div class="card-course">${esc(l.course)}</div>
            <div class="card-title">${esc(l.title)}</div>
            ${l.description ? `<div class="card-desc">${esc(l.description)}</div>` : ''}
            <div class="card-meta">
                <div class="card-author">
                    <a href="/profile/${l.author_id}" onclick="event.stopPropagation()">${esc(l.author)}</a>
                    ${year ? ' · ' + year : ''}
                </div>
                <div class="card-tags">
                    ${commentsTag}
                    <span class="tag">${modLabel}</span>
                    ${noTest}
                </div>
            </div>
        </div>`;
    }).join('');
}

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
